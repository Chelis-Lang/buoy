schema = "chelis-provenance-fixture-cases/v1"

[[case]]
id = "change-reaffirmed"
requirement = "CHELIS-PROV-007"
scenario = "exact-reaffirmed-disposition"
polarity = "positive"
operation = "impact-closure"
input = "one exact reaffirmed disposition plus repository review"
expected_outcome = "accept"
diagnostics = []
facts = ["technical-freshness-unchanged=true", "review-only=true"]
execution = "model"

