schema = "chelis-provenance-fixture-cases/v1"

[[case]]
id = "binding-address-resolves"
requirement = "CHELIS-PROV-019"
scenario = "positive-one-line-resolves-the-binding"
polarity = "positive"
operation = "binding-resolution"
input = "a two-line binding record above a declaration and a store object whose bytes hash to the address"
expected_outcome = "accept"
diagnostics = []
facts = ["core-materialization=true", "frozen-upstream-layout", "collision-resistant-member"]
execution = "integration"

[[case]]
id = "binding-object-tampered"
requirement = "CHELIS-PROV-019"
scenario = "negative-tampered-object-dangles"
polarity = "negative"
operation = "binding-resolution"
input = "a store object edited after the address was recorded"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-BINDING-ADDRESS"]
facts = ["structural-immutability", "no-materialization-on-reject", "static-exit-class"]
execution = "integration"

[[case]]
id = "binding-object-missing"
requirement = "CHELIS-PROV-019"
scenario = "negative-missing-object-fails-closed"
polarity = "negative"
operation = "binding-resolution"
input = "a binding address with no object at its content-addressed path"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-BINDING-ADDRESS"]
facts = ["missing-object", "static-exit-class"]
execution = "integration"

[[case]]
id = "binding-store-outside-selectors"
requirement = "CHELIS-PROV-019"
scenario = "negative-store-outside-every-selector-root"
polarity = "negative-control"
operation = "binding-resolution"
input = "a configured binding store that lies under no selector root"
expected_outcome = "reject"
diagnostics = []
facts = ["configuration-boundary", "selector-bounded-store"]
execution = "integration"

[[case]]
id = "binding-marker-field-set-closed"
requirement = "CHELIS-PROV-019"
scenario = "negative-unknown-or-missing-marker-field"
polarity = "negative"
operation = "binding-grammar"
input = "a binding marker carrying a second field, or none"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-MALFORMED-RECORD"]
facts = ["closed-field-set=record", "duplicate-reason-preserved", "no-record-extracted"]
execution = "integration"

[[case]]
id = "binding-marker-malformed-address"
requirement = "CHELIS-PROV-019"
scenario = "negative-marker-address-is-not-a-digest"
polarity = "negative"
operation = "binding-resolution"
input = "a well-formed marker whose address text parses as no digest"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-BINDING-ADDRESS"]
facts = ["grammar-accepts", "resolution-rejects", "no-materialization-on-reject"]
execution = "integration"

[[case]]
id = "binding-change-detection-member"
requirement = "CHELIS-PROV-019"
scenario = "negative-change-detection-member-resolves-nothing"
polarity = "negative"
operation = "binding-resolution"
input = "a compact binding in a build whose active member is xxh3-128"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-BINDING-ADDRESS"]
facts = ["algorithm-not-collision-resistant", "fails-closed=true", "precedes-store-lookup"]
execution = "integration"

[[case]]
id = "binding-conversion-refuses-unconvertible-links"
requirement = "CHELIS-PROV-021"
scenario = "negative-conversion-cannot-narrow-a-claim"
polarity = "negative-control"
operation = "binding-conversion"
input = "an inline link with non-implements navigation, an atom count other than one, or a stale item digest"
expected_outcome = "reject"
diagnostics = []
facts = ["no-laundering=true", "refuses-before-write=true", "store-unchanged=true"]
execution = "integration"

[[case]]
