schema = "chelis-provenance-fixture-cases/v1"

[[case]]
id = "adapter-cross-root"
requirement = "CHELIS-PROV-011"
scenario = "cross-root-equality"
polarity = "positive"
operation = "saved-snapshot-control"
input = "same repository-relative path bytes and config from two absolute roots"
expected_outcome = "equal"
diagnostics = []
facts = ["absolute-root-in-input=false"]
execution = "sdk-control"

[[case]]
id = "adapter-registration-order"
requirement = "CHELIS-PROV-011"
scenario = "registration-order-equality"
polarity = "positive"
operation = "saved-snapshot-control"
input = "same descriptors registered in reverse order"
expected_outcome = "equal"
diagnostics = []
facts = ["descriptor-order=adapter-id"]
execution = "sdk-control"

[[case]]
id = "adapter-ambient-state"
requirement = "CHELIS-PROV-011"
scenario = "daemon-editor-unsaved-state-excluded"
polarity = "negative-control"
operation = "saved-snapshot-control"
input = "vary daemon editor unsaved LSP MCP and provider values"
expected_outcome = "equal"
diagnostics = []
facts = ["ambient-fields-in-input=0"]
execution = "sdk-control"

[[case]]
id = "adapter-unsupported-capability"
requirement = "CHELIS-PROV-011"
scenario = "unsupported-capability"
polarity = "negative"
operation = "saved-snapshot-control"
input = "output row names undeclared syntax capability"
expected_outcome = "reject"
diagnostics = ["SPG-ADAPTER-SDK-CAPABILITY"]
facts = ["materialized=false"]
execution = "sdk-control"

[[case]]
id = "adapter-duplicate-identity"
requirement = "CHELIS-PROV-011"
scenario = "duplicate-adapter-identity"
polarity = "negative"
operation = "saved-snapshot-control"
input = "two adapters register the same immutable ID"
expected_outcome = "reject"
diagnostics = ["SPG-ADAPTER-SDK-DUPLICATE"]
facts = ["registered-count=1"]
execution = "sdk-control"

