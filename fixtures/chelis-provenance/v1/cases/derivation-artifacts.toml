schema = "chelis-provenance-fixture-cases/v1"

[[case]]
id = "derivation-std-bundle-current"
requirement = "CHELIS-PROV-006"
scenario = "artifact-deriv-std-bundle-current"
polarity = "positive"
operation = "derivation-freshness"
input = "packages/chelis-std/ -> crates/chelis-std-bundle/dist/ with exact source target tool configuration relation scope and exclusions"
expected_outcome = "accept"
diagnostics = []
facts = ["artifact=deriv-std-bundle", "fresh=true", "consistent=true", "behavior-correct=unassigned"]
execution = "integration"

[[case]]
id = "derivation-std-bundle-drift"
requirement = "CHELIS-PROV-006"
scenario = "artifact-deriv-std-bundle-source-digest-drift"
polarity = "negative"
operation = "derivation-freshness"
input = "packages/chelis-std/ changed while the derivation record retains the prior source digest"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-DERIVATION-SOURCE-STALE"]
facts = ["artifact=deriv-std-bundle", "consistent=false"]
execution = "integration"

