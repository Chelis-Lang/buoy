schema = "chelis-provenance-fixture-cases/v1"

[[case]]
id = "derivation-current"
requirement = "CHELIS-PROV-006"
scenario = "current-confirmed-derivation"
polarity = "positive"
operation = "derivation-freshness"
input = "exact source target tool configuration relation scope and exclusions"
expected_outcome = "accept"
diagnostics = []
facts = ["fresh=true", "behavior-correct=unassigned"]
execution = "preimplementation"

[[case]]
id = "derivation-source-drift"
requirement = "CHELIS-PROV-006"
scenario = "source-digest-drift"
polarity = "negative"
operation = "derivation-freshness"
input = "source changed target and record unchanged"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-DERIVATION-SOURCE-STALE"]
facts = ["consistent=false"]
execution = "preimplementation"

[[case]]
id = "derivation-target-drift"
requirement = "CHELIS-PROV-006"
