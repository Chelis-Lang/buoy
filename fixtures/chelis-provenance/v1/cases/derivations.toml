[[case]]
id = "derivation-consistency-only"
requirement = "CHELIS-PROV-006"
scenario = "consistency-does-not-prove-behavior"
polarity = "negative-control"
operation = "derivation-freshness"
input = "current structural mirror with passing consistency oracle"
expected_outcome = "accept"
diagnostics = []
facts = ["consistent=true", "behavior-correct=unassigned"]
execution = "preimplementation"
