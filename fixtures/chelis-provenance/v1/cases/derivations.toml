polarity = "negative"
operation = "derivation-freshness"
input = "target changed record unchanged"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-DERIVATION-TARGET-STALE"]
facts = ["consistent=false"]
execution = "preimplementation"

[[case]]
id = "derivation-tool-drift"
requirement = "CHELIS-PROV-006"
scenario = "tool-identity-drift"
polarity = "negative"
operation = "derivation-freshness"
input = "generator version changed record unchanged"
expected_outcome = "reject"
diagnostics = ["CHELIS-PROV-DERIVATION-TOOL-STALE"]
facts = ["consistent=false"]
execution = "preimplementation"

[[case]]
id = "derivation-config-drift"
requirement = "CHELIS-PROV-006"
scenario = "configuration-drift"
polarity = "negative"
operation = "derivation-freshness"
input = "generator flags changed record unchanged"
expected_outcome = "reject"
