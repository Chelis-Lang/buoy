schema = "buoy/repository-config/v3"
digest_algorithms = ["blake3-256"]

[[mounts]]
id = "project"
prefix = "project"

[[selectors]]
mount = "project"
root = "src"
adapter = "artifact/v1"
include = ["**/*"]
exclude = []
authority_expectation = "forbidden"

[[selectors]]
mount = "project"
root = "src"
adapter = "artifact/v1"
include = ["**/*.bin"]
exclude = []
authority_expectation = "forbidden"

[[selectors]]
mount = "project"
root = "buoy"
adapter = "binding/v1"
include = ["**/*.toml"]
exclude = []
authority_expectation = "forbidden"
