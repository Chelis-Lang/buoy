schema = "buoy/repository-config/v3"
digest_algorithms = ["blake3-256"]

[adapter_configurations]
"openspec/v1" = '''
schema = "buoy.openspec-authority/v1"

[[capabilities]]
name = "demo"
format = "openspec/standing-spec/v1"
scope = "openspec.demo"
atom_kind = "behavioral"
lifecycle = "proposed"
reserved_ids = ["OSA-900"]
'''

[[mounts]]
id = "authority"
prefix = "authority"

[[mounts]]
id = "project"
prefix = "project"

[[selectors]]
mount = "authority"
root = "openspec/specs"
adapter = "openspec/v1"
include = ["**/spec.md"]
exclude = []
authority_expectation = "required"

[[selectors]]
mount = "project"
root = "artifact.bin"
adapter = "artifact/v1"
include = ["artifact.bin"]
exclude = []
authority_expectation = "forbidden"

[[selectors]]
mount = "project"
root = "buoy"
adapter = "binding/v1"
include = ["**/*.toml"]
exclude = []
authority_expectation = "forbidden"
