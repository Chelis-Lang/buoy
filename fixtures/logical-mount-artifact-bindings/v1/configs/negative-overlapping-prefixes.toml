schema = "buoy/repository-config/v3"
digest_algorithms = ["xxh3-128"]

[[mounts]]
id = "project"
prefix = "source"

[[mounts]]
id = "authority"
prefix = "source/specs"

[[selectors]]
mount = "project"
root = "src"
adapter = "artifact/v1"
include = ["**/*"]
exclude = []
authority_expectation = "forbidden"
