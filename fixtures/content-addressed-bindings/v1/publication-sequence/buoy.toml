schema = "spec-provenance-config/v2"
digest_algorithms = ["blake3-256"]

[[selectors]]
root = "openspec/specs"
adapter = "openspec/v1"
include = ["**/spec.md"]
exclude = []
authority_expectation = "required"

[[selectors]]
root = "src"
adapter = "rust/v1"
include = ["**/*.rs"]
exclude = []
authority_expectation = "forbidden"

[[selectors]]
root = "buoy/objects"
adapter = "binding/v1"
include = ["**/*.toml"]
exclude = []
authority_expectation = "forbidden"

[adapter_configurations]
"openspec/v1" = '''schema = "buoy.openspec-authority/v1"

[[capabilities]]
name = "demo"
format = "openspec/standing-spec/v1"
scope = "barnacle.generated-lint-catalog"
atom_kind = "behavioral"
lifecycle = "proposed"
reserved_ids = ["BGLC-003", "BGLC-004"]
'''
