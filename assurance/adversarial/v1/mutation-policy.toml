schema = "buoy-adversarial-campaign-policy/v1"
id = "MUTATION-INITIAL-2026-07-22"
kind = "mutation"
tool_id = "cargo-mutants"
tool_version = "27.1.0"
tool_binding = "assurance/v1/toolchain.toml#cargo-mutants@27.1.0"
source_paths = [
  "crates/buoy-core/src/value.rs",
  "crates/buoy-core/src/algorithms.rs",
  "crates/buoy-core/src/report.rs",
  "src/repository.rs",
  "src/oracle.rs",
  "src/publication.rs",
  "src/publication_fs.rs",
  "src/publication_models.rs",
]
configuration_paths = [
  "Cargo.toml",
  "Cargo.lock",
  "crates/buoy-core/Cargo.toml",
  "tests",
  "crates/buoy-core/tests",
  ".cargo/mutants.toml",
  "assurance/v1/toolchain.toml",
  "assurance/adversarial/v1/named-mutants.tsv",
  "assurance/adversarial/v1/mutation-policy.toml",
  "nix/devenv/scripts/adversarial.nix",
]
required_units = [
  "artifact-freshness",
  "strict-decoding",
  "complete-impacts",
  "policy-derivation",
  "process-cleanup",
  "output-enforcement",
  "budget-enforcement",
  "publication-row-check",
  "publication-source-guard",
  "publication-write-prevention",
  "publication-cycle-rejection",
  "publication-target-base-normalization",
  "publication-projection-conformance",
  "publication-lock-identity",
  "publication-parity-rendering",
