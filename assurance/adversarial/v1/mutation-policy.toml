campaign_command = "devenv tasks run buoy:mutation-campaign"
replay_command = "devenv shell -- buoy-mutation-replay"
assurance_scope = "cargo-mutants baseline over explicitly selected deterministic core, shell-validator, and publication symbols plus individually blocking named tripwires; no whole-repository mutation claim"
exclusions = [
  "generated Unicode case-fold data is checked by source regeneration and conformance rather than source mutation",
  "adapters and unrelated migration/product-identity code are outside this initial explicitly selected automated mutation baseline",
  "equivalent or tool-unsupported mutants never count as killed and require exact reviewed nonpassing disposition",
  "the campaign execution skips only its two self-referential committed-artifact tests; post-campaign replay validates the frozen result and all freshness negative controls",
  "The cargo-mutants campaign excludes eight unrelated tests because its copied tree lacks Git metadata and complete active-change files.",
  "Dedicated assurance gates remain mandatory outside mutation execution.",
  "the trybuild UI snapshot test is skipped during cargo-mutants execution because copied-source diagnostics contain tool workspace locations; the dedicated compile-fail gate remains mandatory outside mutation execution",
]
