[package]
name = "spec-provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deprecated compatibility facade for Buoy"

[lib]
name = "spec_provenance"
path = "src/lib.rs"

[[bin]]
name = "spec-provenance"
path = "src/main.rs"

[features]
default = ["xxh3-128"]
xxh3-128 = ["buoy/xxh3-128"]
blake3-256 = ["buoy/blake3-256"]
sha-256 = ["buoy/sha-256"]

[dependencies]
buoy = { path = "../..", version = "=0.2.0", default-features = false }

[lints]
workspace = true
