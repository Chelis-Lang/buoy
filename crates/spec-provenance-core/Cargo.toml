[package]
name = "spec-provenance-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Deprecated compatibility facade for buoy-core"

[lib]
name = "spec_provenance_core"
path = "src/lib.rs"

[features]
default = ["xxh3-128"]
xxh3-128 = ["buoy-core/xxh3-128"]
blake3-256 = ["buoy-core/blake3-256"]
sha-256 = ["buoy-core/sha-256"]

[dependencies]
buoy-core = { path = "../buoy-core", version = "=0.2.0", default-features = false }

[lints]
workspace = true
