name: buoy-bridge
version: 1
description: Buoy traceability workflow
artifacts:
  - id: proposal
    generates: proposal.md
    description: High-level description of the change, its motivation, and scope
    template: proposal.md
    requires: []
  - id: specs
    generates: specs/**/*.md
    description: Detailed specifications with requirements and scenarios
    template: specs/spec.md
    requires:
      - proposal
  - id: design
    generates: design.md
    description: Technical design decisions and implementation approach
    template: design.md
    requires:
      - specs
  - id: traceability
    generates: traceability.md
    description: Requirement IDs and planned code, evidence, and external link actions
    template: traceability.md
    requires:
      - specs
      - design
  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    requires:
      - traceability
apply:
  requires:
    - tasks
  tracks: tasks.md
